name: Verify and build
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-reviewer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --version && python3 --version
      - name: Install Pillow for ingest tests
        run: |
          python3 -m venv "$RUNNER_TEMP/assets-test-python"
          "$RUNNER_TEMP/assets-test-python/bin/python" -m pip install 'Pillow==13.0.0'
          echo "$RUNNER_TEMP/assets-test-python/bin" >> "$GITHUB_PATH"
      - run: npm test
      - run: npm run build
